<!DOCTYPE html>
<html>
<head>
    <title>Edit Attraction</title>
</head>
<body>

<h1>Edit Attraction: {{ attraction.name }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">💾 Save Changes</button>
</form>

<br>

<a href="{% url 'attraction_detail' attraction.id %}">
    ⬅ Cancel
</a>

</body>
</html>
