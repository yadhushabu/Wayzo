<!DOCTYPE html>
<html>
<head>
    <title>Edit Review - {{ review.place.name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .place-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .place-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .rating-stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 10px;
        }

        .rating-stars input {
            display: none;
        }

        .rating-stars label {
            font-size: 40px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }

        .rating-stars label:hover,
        .rating-stars label:hover ~ label,
        .rating-stars input:checked ~ label {
            color: #ffc107;
        }

        .review-text {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        .review-text:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc3545;
            margin-top: 10px;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .action-buttons a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
        }

        @media (max-width: 768px) {
            .rating-stars label {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✏️ Edit Your Review</h1>
        <p>Update your experience at {{ review.place.name }}</p>
    </div>

    <div class="content">
        <div class="place-info">
            <h3>{{ review.place.name }}</h3>
            <p>{{ review.place.destination.name }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Your Rating</label>
                <div class="rating-stars">
                    <input type="radio" name="rating" value="5" id="star5" {% if review.rating == 5 %}checked{% endif %}>
                    <label for="star5">★</label>
                    <input type="radio" name="rating" value="4" id="star4" {% if review.rating == 4 %}checked{% endif %}>
                    <label for="star4">★</label>
                    <input type="radio" name="rating" value="3" id="star3" {% if review.rating == 3 %}checked{% endif %}>
                    <label for="star3">★</label>
                    <input type="radio" name="rating" value="2" id="star2" {% if review.rating == 2 %}checked{% endif %}>
                    <label for="star2">★</label>
                    <input type="radio" name="rating" value="1" id="star1" {% if review.rating == 1 %}checked{% endif %}>
                    <label for="star1">★</label>
                </div>
            </div>

            <div class="form-group">
                <label>Your Review</label>
                <textarea name="review" class="review-text" rows="6" required>{{ review.review }}</textarea>
            </div>

            <button type="submit" class="btn-submit">💾 Update Review</button>
        </form>

        <div class="action-buttons">
            <a href="{% url 'destinations:place_detail' review.place.id %}" class="btn-cancel">Cancel</a>
            <a href="{% url 'destinations:delete_review' review.id %}" class="btn-danger" 
               onclick="return confirm('Are you sure you want to delete your review? This cannot be undone.')">🗑️ Delete Review</a>
        </div>
    </div>
</div>

</body>
</html>
