<!DOCTYPE html>
<html>
<head>
    <title>Delete Travel Plan - Wayzo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container { max-width: 500px; margin: 0 auto; }
        
        .delete-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .delete-header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .delete-header i { font-size: 48px; margin-bottom: 15px; }
        .delete-header h2 { font-size: 24px; margin-bottom: 10px; }
        
        .delete-body { padding: 30px; text-align: center; }
        .delete-body p { color: #666; margin-bottom: 15px; }
        
        .plan-destination {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            color: #333;
            margin: 15px 0;
        }
        
        .warning-text { color: #dc3545; font-size: 12px; margin-top: 15px; }
        
        .delete-footer {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            background: #f8f9fa;
        }
        
        .btn-cancel, .btn-delete {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-cancel { background: #6c757d; color: white; }
        .btn-cancel:hover { background: #5a6268; color: white; }
        
        .btn-delete { background: #dc3545; color: white; border: none; cursor: pointer; }
        .btn-delete:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <div class="delete-card">
        <div class="delete-header">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>Delete Travel Plan</h2>
            <p>This action cannot be undone</p>
        </div>
        
        <div class="delete-body">
            <p>Are you sure you want to delete this travel plan?</p>
            <div class="plan-destination">
                <i class="fas fa-map-marker-alt"></i> {{ plan.destination_query }}
            </div>
            <p class="warning-text">
                <i class="fas fa-info-circle"></i> All data associated with this travel plan will be permanently removed.
            </p>
        </div>
        
        <div class="delete-footer">
            <a href="{% url 'travellers:my_travel_plans' %}" class="btn-cancel">
                <i class="fas fa-times"></i> Cancel
            </a>
            <form method="post" style="flex: 1;">
                {% csrf_token %}
                <button type="submit" class="btn-delete">
                    <i class="fas fa-trash"></i> Yes, Delete
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
