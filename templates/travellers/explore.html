<h1>🔥 Trending Destinations</h1>

<div class="grid">

{% for place in trending %}

    <div class="card">

        <a href="{% url 'travellers:destination_detail' place.id %}">

            <h2>{{ place.name }}</h2>

            {% if place.weather %}
                <p>🌡️ {{ place.weather.temp }}°C</p>
                <p>{{ place.weather.description }}</p>
            {% endif %}

            <p>🔥 Trending Score: {{ place.score }}</p>

        </a>

    </div>

{% endfor %}

</div>
